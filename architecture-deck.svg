<marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#8FB5A9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="h" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#9BE3C4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1920" height="1080" fill="#12362F"/>
<text x="96" y="104" font-size="30" font-weight="650" fill="#9BE3C4" text-anchor="start">Margin</text><text x="96" y="178" font-size="66" font-weight="650" fill="#FFFFFF" letter-spacing="-1.4">From highlighted passage to reviewed answer</text><text x="96" y="232" font-size="29" fill="#BFD6CD">A multi-agent LangGraph workflow that runs on your own computer by default</text><rect x="1544" y="328" width="280" height="398" rx="28" fill="#1B4940" stroke="#3B6E62" stroke-width="1.5"/><path d="M316 540H380" fill="none" stroke="#8FB5A9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M600 540H664" fill="none" stroke="#8FB5A9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M884 540H920" fill="none" stroke="#8FB5A9" stroke-width="2.6" stroke-linejoin="round"/><path d="M920 540V445Q920 435 930 435H960" fill="none" stroke="#8FB5A9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M920 540V645Q920 655 930 655H960" fill="none" stroke="#8FB5A9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a)"/><text x="889" y="420" font-size="17" font-weight="500" fill="#8FB5A9" text-anchor="start">Explain</text><text x="888" y="680" font-size="17" font-weight="500" fill="#8FB5A9" text-anchor="start">Visualize</text><path d="M1200 435H1235Q1245 435 1245 445V645Q1245 655 1235 655H1200" fill="none" stroke="#8FB5A9" stroke-width="2.6" stroke-linejoin="round"/><path d="M1245 540H1272" fill="none" stroke="#8FB5A9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M1502 540H1530" fill="none" stroke="#8FB5A9" stroke-width="2.6" stroke-linejoin="round"/><path d="M1530 540V489Q1530 479 1540 479H1564" fill="none" stroke="#8FB5A9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M1530 540V626Q1530 636 1540 636H1564" fill="none" stroke="#8FB5A9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M1387 455V335Q1387 325 1377 325H1090Q1080 325 1080 335V360" fill="none" stroke="#9BE3C4" stroke-width="3.2" stroke-dasharray="3 10" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><text x="1234" y="308" font-size="20" font-weight="500" fill="#9BE3C4" text-anchor="middle">Rejected once: rewrite with notes</text><path d="M1387 625V745Q1387 755 1377 755H1160Q1150 755 1150 745V730" fill="none" stroke="#9BE3C4" stroke-width="3.2" stroke-dasharray="3 10" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><text x="1268" y="785" font-size="20" font-weight="500" fill="#9BE3C4" text-anchor="middle">Rejected once: redraw with notes</text><path d="M1684 726V810Q1684 820 1674 820H1030Q1020 820 1020 810V730" fill="none" stroke="#9BE3C4" stroke-width="3.2" stroke-dasharray="3 10" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><text x="1360" y="851" font-size="20" font-weight="500" fill="#9BE3C4" text-anchor="middle">Visual won't render: one automatic repair, which skips review</text><path d="M774 662V625" fill="none" stroke="#8FB5A9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a)"/><rect x="96" y="455" width="220" height="170" rx="22" fill="#F6FAF7" filter="url(#s)"/><text x="122" y="547" font-size="27" font-weight="650" fill="#14231F" letter-spacing="-0.3">Highlight</text><text x="122" y="583" font-size="20.5" fill="#50625C">Explain, Visualize,</text><text x="122" y="610" font-size="20.5" fill="#50625C">or a follow-up</text><rect x="122" y="475" width="150" height="9" rx="3" fill="#D5DEDA"/><rect x="122" y="489" width="168" height="11" rx="3" fill="#5FC8A2"/><rect x="122" y="503" width="120" height="9" rx="3" fill="#D5DEDA"/><rect x="380" y="455" width="220" height="170" rx="22" fill="#F6FAF7" filter="url(#s)"/><text x="406" y="505" font-size="27" font-weight="650" fill="#14231F" letter-spacing="-0.3">Coordinator</text><circle cx="570" cy="496" r="8" fill="#2F9E7C"/><text x="406" y="541" font-size="20.5" fill="#50625C">Identifies passage</text><text x="406" y="568" font-size="20.5" fill="#50625C">type and search</text><text x="406" y="595" font-size="20.5" fill="#50625C">terms</text><rect x="664" y="455" width="220" height="170" rx="22" fill="#F6FAF7" filter="url(#s)"/><text x="690" y="505" font-size="27" font-weight="650" fill="#14231F" letter-spacing="-0.3">Librarian</text><text x="690" y="541" font-size="20.5" fill="#50625C">Finds related</text><text x="690" y="568" font-size="20.5" fill="#50625C">passages with</text><text x="690" y="595" font-size="20.5" fill="#50625C">BM25, no LLM</text><rect x="674" y="662" width="200" height="60" rx="16" fill="none" stroke="#8FB5A9" stroke-width="2"/><text x="774" y="699" font-size="20" font-weight="500" fill="#D8E8E1" text-anchor="middle">Paper text, by page</text><rect x="960" y="360" width="240" height="150" rx="22" fill="#F6FAF7" filter="url(#s)"/><text x="986" y="402" font-size="27" font-weight="650" fill="#14231F" letter-spacing="-0.3">Tutor</text><circle cx="1170" cy="393" r="8" fill="#2F9E7C"/><text x="986" y="438" font-size="20.5" fill="#50625C">Streams a plain</text><text x="986" y="465" font-size="20.5" fill="#50625C">explanation with</text><text x="986" y="492" font-size="20.5" fill="#50625C">page citations</text><rect x="960" y="580" width="240" height="150" rx="22" fill="#F6FAF7" filter="url(#s)"/><text x="986" y="620" font-size="27" font-weight="650" fill="#14231F" letter-spacing="-0.3">Illustrator</text><circle cx="1170" cy="611" r="8" fill="#2F9E7C"/><text x="986" y="656" font-size="20.5" fill="#50625C">Draws a diagram</text><text x="986" y="683" font-size="20.5" fill="#50625C">or an interactive</text><text x="986" y="710" font-size="20.5" fill="#50625C">visual</text><rect x="1272" y="455" width="230" height="170" rx="22" fill="#9BE3C4" filter="url(#s)"/><text x="1298" y="500" font-size="30" font-weight="650" fill="#14231F" letter-spacing="-0.3">Reviewer</text><circle cx="1472" cy="491" r="8" fill="#2F9E7C"/><text x="1298" y="536" font-size="20.5" fill="#1F4238">Checks facts,</text><text x="1298" y="563" font-size="20.5" fill="#1F4238">citations, and math</text><text x="1298" y="590" font-size="20.5" fill="#1F4238">against the paper</text><text x="1566" y="368" font-size="22" font-weight="650" fill="#FFFFFF" text-anchor="start">Beside the page</text><text x="1566" y="396" font-size="18" font-weight="500" fill="#BFD6CD" text-anchor="start">Visuals run in a sandbox</text><rect x="1564" y="414" width="240" height="130" rx="22" fill="#F6FAF7" filter="url(#s)"/><text x="1590" y="454" font-size="25" font-weight="650" fill="#14231F" letter-spacing="-0.3">Reviewed answer</text><text x="1590" y="490" font-size="20.5" fill="#50625C">With page citations</text><text x="1590" y="517" font-size="20.5" fill="#50625C">and the model used</text><rect x="1564" y="566" width="240" height="140" rx="22" fill="#F6FAF7" filter="url(#s)"/><text x="1590" y="610" font-size="25" font-weight="650" fill="#14231F" letter-spacing="-0.3">Flagged answer</text><text x="1590" y="646" font-size="20.5" fill="#50625C">Rejected twice, so it</text><text x="1590" y="673" font-size="20.5" fill="#50625C">carries a warning</text><rect x="96" y="892" width="1728" height="116" rx="28" fill="#1B4940" stroke="#3B6E62" stroke-width="1.5"/><circle cx="134" cy="950" r="8" fill="#5FD0A6"/><text x="156" y="943" font-size="25" font-weight="650" fill="#FFFFFF" text-anchor="start">Language model</text><text x="156" y="972" font-size="18" font-weight="500" fill="#BFD6CD" text-anchor="start">Used by every marked agent</text><rect x="480" y="914" width="440" height="72" rx="18" fill="#9BE3C4"/><text x="504" y="944" font-size="22" font-weight="650" fill="#14231F" text-anchor="start">This computer</text><text x="504" y="971" font-size="18" font-weight="500" fill="#1F4238" text-anchor="start">Gemma 4 through Ollama, the default</text><rect x="944" y="914" width="440" height="72" rx="18" fill="#F6FAF7"/><text x="968" y="944" font-size="22" font-weight="650" fill="#14231F" text-anchor="start">Groq</text><text x="968" y="971" font-size="18" font-weight="500" fill="#50625C" text-anchor="start">GPT-OSS models, after the student confirms</text><text x="1412" y="944" font-size="21" font-weight="550" fill="#FFFFFF" text-anchor="start">A local failure never falls</text><text x="1412" y="972" font-size="21" font-weight="550" fill="#FFFFFF" text-anchor="start">back to the cloud</text>
</svg>